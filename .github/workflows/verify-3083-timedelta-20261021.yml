name: Verify Marshmallow TimeDelta docs and regression
on:
  push:
    branches:
      - verify/3083-timedelta-20261021
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install marshmallow and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest simplejson ruff
      - name: Test TimeDelta plus field suite
        run: python -m pytest -q tests/test_timedelta_units.py tests/test_fields.py --disable-warnings --maxfail=1
      - name: Ruff validation
        if: always()
        run: |
          python -m ruff check --no-fix src/marshmallow/fields.py tests/test_timedelta_units.py
          python -m ruff format --check src/marshmallow/fields.py tests/test_timedelta_units.py
